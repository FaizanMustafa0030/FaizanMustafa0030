  <title id="title">Featured Projects</title>
  <desc id="description">Development: Personal Portfolio Website. Built a personal portfolio using React, Vite, and Tailwind CSS. Development: Online Shopping System. Built product browsing, cart, checkout, and order history with Java Swing and MySQL. Academic testing: Attendance Management System. Verified attendance workflows, database CRUD operations, and report outputs. Academic testing: Courier Pick &amp; Drop Website. Tested booking and tracking flows and checked API behavior in Postman. Academic testing: File Explorer System. Tested file operations and invalid inputs. Documented defects. Academic testing: Lost &amp; Found Community App. Tested form validation and authentication flows in the Flutter app. Academic testing: AI/NLP Chatbot. Tested intent recognition, response accuracy, fallback behavior, and the API.</desc>
